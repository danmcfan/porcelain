repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test-short
        name: go test -short
        entry: go test -short ./...
        language: system
        types: [go]
        pass_filenames: false
